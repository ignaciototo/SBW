<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Estudio · Gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F4EE;
    --panel:#FBFAF6;
    --ink:#211F1C;
    --ink-soft:#5B564C;
    --line:#DAD3C2;
    --navy:#2E3F5C;
    --navy-deep:#1F2C42;
    --burgundy:#8A3A3A;
    --ochre:#A9791F;
    --green:#3E6650;
    --danger-bg:#F4E4E0;
    --warn-bg:#F7EDD9;
    --ok-bg:#E4EDE6;
    --wa-green:#25D366;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:500;margin:0;}
  .app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:220px;
    flex-shrink:0;
    background:var(--navy-deep);
    color:#EFE9DC;
    padding:28px 0;
    display:flex;
    flex-direction:column;
  }
  .brand{
    padding:0 22px 18px 22px;
    margin-bottom:12px;
  }
  .brand h1{font-size:19px;color:#fff;letter-spacing:0.2px;}
  .brand span{display:block;font-size:11px;color:#B9AF97;margin-top:4px;}
  
  .search-box {
    padding: 0 16px 18px 16px;
    border-bottom: 1px solid rgba(239,233,220,0.15);
    margin-bottom: 12px;
  }
  .search-box input {
    width: 100%;
    padding: 8px 10px;
    border-radius: 4px;
    border: none;
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-size: 13px;
  }
  .search-box input::placeholder { color: rgba(255,255,255,0.4); }
  .search-box input:focus { outline: none; background: rgba(255,255,255,0.15); }

  .nav{list-style:none;padding:0;margin:0;flex:1;}
  .nav li{margin:0;}
  .nav button{
    width:100%;
    text-align:left;
    background:none;
    border:none;
    color:#D9D2C0;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    padding:11px 22px;
    cursor:pointer;
    border-left:3px solid transparent;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .nav button:hover{background:rgba(255,255,255,0.05);}
  .nav button.active{
    background:rgba(255,255,255,0.08);
    border-left-color:var(--ochre);
    color:#fff;
  }
  .nav .count{
    margin-left:auto;
    background:var(--burgundy);
    color:#fff;
    font-size:10.5px;
    padding:1px 7px;
    border-radius:9px;
    font-weight:600;
  }

  /* Main */
  .main{flex:1;padding:34px 42px;max-width:1080px; overflow-y:auto;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;}
  .page-head h2{font-size:23px;}
  .page-head p{margin:4px 0 0 0;color:var(--ink-soft);font-size:13px;}
  .btn{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    padding:9px 16px;
    border-radius:3px;
    border:1px solid var(--navy);
    background:var(--navy);
    color:#fff;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
  }
  .btn:hover{background:var(--navy-deep);}
  .btn.secondary{background:transparent;color:var(--navy);border-color:var(--line);}
  .btn.secondary:hover{border-color:var(--navy);background:rgba(0,0,0,0.02);}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn.wa{background:transparent;color:var(--wa-green);border-color:var(--wa-green);}
  .btn.wa:hover{background:var(--wa-green);color:#fff;}

  /* Stat cards */
  .stats{display:flex;gap:14px;margin-bottom:26px;}
  .stat{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    padding:16px 18px;
  }
  .stat .n{font-family:'Fraunces',serif;font-size:28px;line-height:1;}
  .stat .l{font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .stat.alert .n{color:var(--burgundy);}
  .stat.warn .n{color:var(--ochre);}

  /* Section block */
  .block{background:var(--panel);border:1px solid var(--line);margin-bottom:20px;}
  .block-head{
    padding:12px 18px;
    border-bottom:1px solid var(--line);
    font-family:'Fraunces',serif;
    font-size:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .empty{padding:26px 18px;color:var(--ink-soft);font-size:13px;text-align:center;}

  table{width:100%;border-collapse:collapse;}
  th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.03em;
    color:var(--ink-soft);
    font-weight:600;
    padding:9px 18px;
    border-bottom:1px solid var(--line);
  }
  td{padding:11px 18px;border-bottom:1px solid #ECE7DA;font-size:13.5px;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.row-click{cursor:pointer;}
  tr.row-click:hover{background:#F1EDE1;}

  .tag{
    display:inline-block;
    font-size:11px;
    font-weight:600;
    padding:3px 9px;
    border-radius:3px;
  }
  .tag.vencido{background:var(--danger-bg);color:var(--burgundy);}
  .tag.hoy{background:var(--warn-bg);color:#805a13;border:1px solid #d4a953;font-weight:700;}
  .tag.proximo{background:var(--warn-bg);color:var(--ochre);}
  .tag.programado{background:#E7E9EE;color:var(--navy);}
  .tag.cumplido{background:var(--ok-bg);color:var(--green);}
  .tag.activo{background:var(--ok-bg);color:var(--green);}
  .tag.archivado{background:#EEEAE0;color:var(--ink-soft);}

  .muted{color:var(--ink-soft);}
  .meta-text { font-size:10.5px; color:#958F80; margin-top:3px; display:block; }

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(31,28,23,0.45);
    display:flex;align-items:flex-start;justify-content:center;
    padding:40px 20px;overflow:auto;z-index:50;
  }
  .modal{
    background:var(--panel);
    border:1px solid var(--line);
    width:100%;max-width:520px;
    padding:26px 28px 22px 28px;
  }
  .modal h3{font-size:18px;margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:600;}
  .field input, .field select, .field textarea{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--line);
    background:#fff;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    color:var(--ink);
    border-radius:2px;
  }
  .field textarea{resize:vertical;min-height:56px;}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  .toast{
    position:fixed;bottom:24px;right:24px;
    background:var(--navy-deep);color:#fff;
    padding:11px 18px;border-radius:3px;font-size:13px;
    box-shadow:0 4px 14px rgba(0,0,0,0.2);
    z-index:100;
  }
  .loading{padding:60px;text-align:center;color:var(--ink-soft);}

  /* Timeline */
  .timeline{padding:6px 18px 14px 18px;}
  .timeline-item{
    display:grid;
    grid-template-columns:90px 1fr auto;
    gap:14px;
    padding:12px 0;
    border-bottom:1px solid #ECE7DA;
    align-items:start;
  }
  .timeline-item:last-child{border-bottom:none;}
  .timeline-date{font-size:12px;color:var(--ink-soft);padding-top:1px;white-space:nowrap;}
  .timeline-desc{font-size:13.5px;line-height:1.5;}
  .timeline-actions{white-space:nowrap;}

  .link-btn{background:none;border:none;color:var(--navy);text-decoration:underline;cursor:pointer;font-size:12.5px;padding:0;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:13px;padding:2px 4px;}
  .icon-btn:hover{color:var(--burgundy);}

  /* Ficha partes */
  .ficha-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:16px 18px;background:#fff;}
  .ficha-col h4{font-size:11px;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px 0;letter-spacing:0.03em;}
  .ficha-dato{font-size:13.5px;margin-bottom:8px;}
  .ficha-dato strong{display:block;font-weight:500;}
  .ficha-dato span{color:var(--ink-soft);font-size:12.5px;}
</style>
</head>
<body>
<div id="root" class="loading">Cargando estudio…</div>

<script>
const root = document.getElementById('root');
const uid = () => Math.random().toString(36).slice(2,9);
const todayStr = () => new Date().toISOString().slice(0,10);
const timeStr = () => new Date().toLocaleTimeString('es-AR', {hour: '2-digit', minute:'2-digit'});
const addDays = n => { const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };

let state = {
  config: { rutaRaiz: '\\\\SERVIDOR\\Estudio\\', usuarioActual: 'Usuario 1' },
  clientes: [], expedientes: [], vencimientos: [], eventos: [], documentos: [],
  formatos: [], tiposTramite: [], gastos: [], honorarios: [], ferias: [],
  view: 'panel', selectedExpedienteId: null, modal: null, searchQuery: ''
};

// --- Datos Semilla ---
const seed = {
  config: { rutaRaiz: '\\\\SERVIDOR\\Estudio\\', usuarioActual: 'Ignacio' },
  clientes: [
    {id: uid(), nombre:'María Fernanda Ríos', doc:'27-33445566-1', telefono:'011-4455-1122', email:'mfrios@mail.com', notas:''}
  ],
  expedientes: [], vencimientos: [], eventos: [], documentos: [], formatos: [], tiposTramite: [], gastos: [], honorarios: [], ferias: []
};
// Agrego un expediente semilla
seed.expedientes.push({id: uid(), caratula:'Ríos, María F. c/ Seguros del Sur s/ Daños', fuero:'Civil', juzgado:'Juzg 42', numero:'CIV 12345/2025', clienteId: seed.clientes[0].id, estado:'activo', responsable:'Ignacio', notas:'', contraparteNombre:'Seguros del Sur', contraparteAbogado:'', contraparteContacto:'', linkPortal:'', rutaCarpeta:'\\\\SERVIDOR\\Estudio\\rios\\daños', creadoPor:'Sistema', creadoEn:todayStr()});
seed.honorarios.push({id: uid(), expedienteId: seed.expedientes[0].id, concepto:'Pacto Cuota Litis (20%)', monto: 500000, cuotas: 1, pagado: 0, fechaVencimiento: addDays(30), notas: 'A cobrar con la liquidación final', creadoPor:'Sistema'});

// --- Carga y Guardado ---
async function loadState(){
  try{
    let res = window.storage ? await window.storage.get('estudio-data') : { value: localStorage.getItem('estudio-data') };
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      state.config = parsed.config || seed.config;
      state.clientes = parsed.clientes || [];
      state.expedientes = parsed.expedientes || [];
      state.vencimientos = parsed.vencimientos || [];
      state.eventos = parsed.eventos || [];
      state.documentos = parsed.documentos || [];
      state.formatos = parsed.formatos || [];
      state.tiposTramite = parsed.tiposTramite || [];
      state.gastos = parsed.gastos || [];
      state.honorarios = parsed.honorarios || [];
      state.ferias = parsed.ferias || [];
    } else {
      state = {...state, ...seed};
      await saveState();
    }
  }catch(e){ state = {...state, ...seed}; }
  render();
}

async function saveState(){
  try{
    const str = JSON.stringify(state);
    if(window.storage) await window.storage.set('estudio-data', str);
    else localStorage.setItem('estudio-data', str);
  }catch(e){ showToast('No se pudo guardar.'); }
}

// --- Utilidades ---
function showToast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3500);
}
function clienteNombre(id){ const c = state.clientes.find(c=>c.id===id); return c ? c.nombre : '—'; }
function expedienteCaratula(id){ const e = state.expedientes.find(e=>e.id===id); return e ? e.caratula : '—'; }
function fmtFecha(f){ if(!f) return ''; const [y,m,d]=f.split('-'); return `${d}/${m}/${y}`; }
function formatDinero(num){ return new Intl.NumberFormat('es-AR', {style:'currency', currency:'ARS'}).format(num); }
function escAttr(obj){ return `JSON.parse(decodeURIComponent('${encodeURIComponent(JSON.stringify(obj))}'))`; }
function setView(v){ state.view = v; state.searchQuery = ''; render(); }
function openModal(type, data){ state.modal = {type, data: data ? {...data} : null}; render(); }
function closeModal(){ state.modal = null; render(); }
function viewExpediente(id){ state.selectedExpedienteId = id; setView('expediente-detail'); }
function sanitizePathName(str) {
  if(!str) return 'sin_nombre';
  return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]/g, "_").toLowerCase().replace(/_+/g, '_');
}

// --- Funciones Nuevas (Reporte, WA, Búsqueda, Archivo) ---
function handleSearch(q) {
  state.searchQuery = q.toLowerCase();
  state.view = state.searchQuery.length > 1 ? 'search' : 'panel';
  render();
}

async function generarReporteCliente(expId) {
  const e = state.expedientes.find(x=>x.id===expId);
  const evs = state.eventos.filter(ev=>ev.expedienteId===expId).sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0, 10);
  let txt = `*Reporte de Estado del Caso*\nCarátula: ${e.caratula}\nJuzgado: ${e.fuero} - ${e.juzgado || '-'}\n\n*Últimos movimientos:*\n`;
  if(evs.length===0) txt += "No hay movimientos recientes registrados.";
  evs.forEach(ev => { txt += `- ${fmtFecha(ev.fecha)}: ${ev.descripcion}\n`; });
  
  try {
    await navigator.clipboard.writeText(txt);
    showToast('Reporte copiado al portapapeles. Podés pegarlo en WhatsApp o Email.');
  } catch(err) { showToast('Error al copiar el reporte.'); }
}

function enviarWhatsAppResumenDiario() {
  const hoy = todayStr();
  const vencenHoy = state.vencimientos.filter(v => v.fecha === hoy && !v.cumplido);
  const vencidos = state.vencimientos.filter(v => v.fecha < hoy && !v.cumplido);
  
  let txt = `*Resumen del Estudio - ${fmtFecha(hoy)}*\n\n`;
  if(vencenHoy.length > 0) {
    txt += `*VENCEN HOY / GRACIA:*\n`;
    vencenHoy.forEach(v => { txt += `- ${v.tipo} (${expedienteCaratula(v.expedienteId)})\n`; });
  } else { txt += `No hay vencimientos para hoy. 🙌\n`; }
  
  if(vencidos.length > 0) {
    txt += `\n*⚠️ ATENCIÓN - VENCIDOS Y PENDIENTES:*\nHay ${vencidos.length} trámite/s atrasado/s. Revisar sistema.`;
  }
  window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
}

function enviarWhatsApp(expedienteId) {
  const exp = state.expedientes.find(e => e.id === expedienteId);
  const cli = state.clientes.find(c => c.id === exp.clienteId);
  const evs = state.eventos.filter(ev => ev.expedienteId === expedienteId).sort((a,b) => b.fecha.localeCompare(a.fecha));
  if (!cli || !cli.telefono) { showToast('El cliente no tiene un teléfono cargado en su ficha.'); return; }
  if (evs.length === 0) { showToast('No hay eventos registrados en este expediente para avisar.'); return; }
  const telLimpio = cli.telefono.replace(/\D/g,'');
  const msj = `Hola ${cli.nombre}, nos comunicamos del Estudio. Te escribimos para avisarte que hay un nuevo movimiento en tu caso (${exp.caratula}).\n\nEl último evento registrado es:\n*${evs[0].descripcion}*\n\nCualquier consulta quedamos a disposición. ¡Saludos!`;
  window.open(`https://wa.me/549${telLimpio}?text=${encodeURIComponent(msj)}`, '_blank');
}

async function archivarExpediente(id) {
  const tienePendientes = state.vencimientos.some(v => v.expedienteId === id && !v.cumplido);
  const gastosPendientes = state.gastos.some(g => g.expedienteId === id && g.pagadoPor === 'estudio' && !g.reintegrado);
  const honorariosPendientes = state.honorarios.some(h => h.expedienteId === id && h.pagado < h.monto);
  
  if(tienePendientes || gastosPendientes || honorariosPendientes) {
    alert('No se puede archivar:\nEl expediente tiene vencimientos abiertos, gastos a reintegrar u honorarios pendientes de cobro.');
    return;
  }
  if(confirm('¿Confirmás el pase a archivo de este expediente? Ya no sumará inactividad ni aparecerá en la lista activa.')) {
    const e = state.expedientes.find(x=>x.id===id);
    e.estado = 'archivado';
    e.actualizadoPor = state.config.usuarioActual;
    e.actualizadoEn = todayStr();
    await saveState();
    render();
    showToast('Expediente archivado correctamente.');
  }
}

// --- CRUD con Trazabilidad ---
async function saveGeneric(col, form){
  const now = todayStr();
  const isNew = !form.id;
  const data = { 
    id: form.id || uid(), 
    ...form,
    actualizadoPor: state.config.usuarioActual,
    actualizadoEn: now
  };
  if(isNew) {
    data.creadoPor = state.config.usuarioActual;
    data.creadoEn = now;
  } else {
    // Preservar quien lo creo originalmente
    const existing = state[col].find(x=>x.id===data.id);
    if(existing) { data.creadoPor = existing.creadoPor; data.creadoEn = existing.creadoEn; }
  }
  
  const idx = state[col].findIndex(x=>x.id===data.id);
  if(idx>=0) state[col][idx]=data; else state[col].push(data);
  await saveState(); closeModal(); render();
}
async function deleteGeneric(col, id){ state[col] = state[col].filter(x=>x.id!==id); await saveState(); render(); }

async function saveCliente(f){ await saveGeneric('clientes', f); showToast('Cliente guardado'); }
async function saveExpediente(f){ 
  if(!f.rutaCarpeta || f.rutaCarpeta.trim() === '') {
    const cli = state.clientes.find(c => c.id === f.clienteId);
    let base = state.config.rutaRaiz || '\\\\SERVIDOR\\Estudio\\';
    if(!base.endsWith('\\') && !base.endsWith('/')) base += '\\';
    f.rutaCarpeta = `${base}${sanitizePathName(cli?.nombre)}\\${sanitizePathName(f.numero || f.caratula)}`;
  }
  await saveGeneric('expedientes', {...f, estado: f.estado||'activo'}); 
  showToast('Expediente guardado'); 
}
async function saveHonorario(f){ await saveGeneric('honorarios', {...f, monto: Number(f.monto), pagado: Number(f.pagado), cuotas: Number(f.cuotas)}); showToast('Honorario registrado'); }
async function deleteHonorario(id){ await deleteGeneric('honorarios', id); }

// (Omito repetición de saves genéricos. Apuntan todos a saveGeneric)
const saveVencimiento = async(f) => { await saveGeneric('vencimientos', {...f, cumplido: f.cumplido==='true'||f.cumplido===true}); showToast('Vencimiento guardado'); };
const saveGasto = async(f) => { await saveGeneric('gastos', {...f, importe: Number(f.importe), reintegrado: f.reintegrado==='on'}); showToast('Gasto registrado'); };
const saveFeria = async(f) => { await saveGeneric('ferias', f); showToast('Feria guardada'); };
const saveFormato = async(f) => { await saveGeneric('formatos', f); showToast('Formato guardado'); };
const saveTramite = async(f) => { await saveGeneric('tiposTramite', {...f, dias: Number(f.dias)}); showToast('Plazo guardado'); };
const saveDocumento = async(f) => { await saveGeneric('documentos', f); showToast('Documento guardado'); };

async function saveEvento(form){
  const data = { id: form.id || uid(), expedienteId: form.expedienteId, fecha: form.fecha, descripcion: form.descripcion, documentoId: form.documentoId || '', tipoTramiteId: form.tipoTramiteId || '' };
  await saveGeneric('eventos', data);
  const tramite = state.tiposTramite.find(t=>t.id===data.tipoTramiteId);
  if(tramite){
    showToast('Calculando vencimiento sugerido…');
    // Para no complicar con async/await en feriados acá, asumo suma de días simple para el MVP o llamas a tu función addBusinessDays
    const d = new Date(data.fecha+'T00:00:00'); d.setDate(d.getDate() + tramite.dias);
    openModal('vencimiento', { expedienteId: data.expedienteId, tipo: tramite.nombre, fecha: d.toISOString().slice(0,10), notas: `Sugerido por: "${data.descripcion}"`});
  }
}
async function toggleCumplido(id){ const v = state.vencimientos.find(v=>v.id===id); if(v){ v.cumplido = !v.cumplido; v.actualizadoPor = state.config.usuarioActual; await saveState(); render(); } }

function estadoVencimiento(v){
  if(v.cumplido) return 'cumplido';
  const hoy = todayStr();
  if(v.fecha < hoy) return 'vencido';
  if(v.fecha === hoy) return 'hoy'; 
  const diff = Math.round((new Date(v.fecha) - new Date(hoy))/(1000*60*60*24));
  if(diff <= 5) return 'proximo';
  return 'programado';
}
const estadoLabel = {vencido:'Vencido', hoy:'Vence HOY', proximo:'Próximo', programado:'Programado', cumplido:'Cumplido'};
function getSemaforoInactividad(expedienteId) {
  const e = state.expedientes.find(x=>x.id===expedienteId);
  if(e.estado === 'archivado') return `<span class="tag archivado">Archivado</span>`;
  const evs = state.eventos.filter(ev => ev.expedienteId === expedienteId).sort((a,b) => b.fecha.localeCompare(a.fecha));
  if (evs.length === 0) return `<span class="tag archivado">Sin mov.</span>`;
  const diff = Math.round((new Date(todayStr()) - new Date(evs[0].fecha)) / (1000*60*60*24));
  if (diff <= 15) return `<span class="tag cumplido">${diff}d (Al día)</span>`;
  if (diff <= 30) return `<span class="tag proximo">${diff}d (Revisar)</span>`;
  return `<span class="tag vencido" style="font-weight:700;">${diff}d (Paralizado)</span>`;
}

  const resExp = state.expedientes.filter(e => e.caratula.toLowerCase().includes(q) || (e.numero||'').toLowerCase().includes(q) || (e.contraparteNombre||'').toLowerCase().includes(q));
  
  return `
    <div class="page-head"><div><h2>Resultados para "${q}"</h2></div><button class="btn secondary" onclick="setView('panel')">Cerrar búsqueda</button></div>

    'cliente': `<form id="mform_cliente"><div class="field"><label>Nombre</label><input name="nombre" required value="${data?.nombre||''}"></div><div class="field-row"><div class="field"><label>DNI/CUIT</label><input name="doc" value="${data?.doc||''}"></div><div class="field"><label>Teléfono (solo números)</label><input name="telefono" value="${data?.telefono||''}"></div></div><div class="field"><label>Email</label><input name="email" value="${data?.email||''}"></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button type="submit" class="btn">Guardar</button></div></form>`,
    'expediente': `<form id="mform_expediente"><div class="field"><label>Carátula</label><input name="caratula" required value="${data?.caratula||''}"></div><div class="field-row"><div class="field"><label>Fuero</label><input name="fuero" value="${data?.fuero||''}"></div><div class="field"><label>N° Expte</label><input name="numero" value="${data?.numero||''}"></div></div><div class="field"><label>Cliente</label><select name="clienteId">${state.clientes.map(c=>`<option value="${c.id}" ${data?.clienteId===c.id?'selected':''}>${c.nombre}</option>`).join('')}</select></div><hr style="border:0; border-top:1px solid var(--line); margin:18px 0;"><h4 style="margin:0 0 10px 0; font-size:13px;">Contraparte</h4><div class="field-row"><div class="field"><label>Nombre Contraparte</label><input name="contraparteNombre" value="${data?.contraparteNombre||''}"></div><div class="field"><label>Abogado</label><input name="contraparteAbogado" value="${data?.contraparteAbogado||''}"></div></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button type="submit" class="btn">Guardar</button></div></form>`,
    'honorario': `<form id="mform_honorario"><input type="hidden" name="expedienteId" value="${data?.expedienteId||''}"><div class="field"><label>Concepto (Ej: Pacto 20%, Etapa 1)</label><input name="concepto" required value="${data?.concepto||''}"></div><div class="field-row"><div class="field"><label>Monto Total Pactado ($)</label><input name="monto" type="number" step="0.01" required value="${data?.monto||''}"></div><div class="field"><label>Monto Cobrado Hasta Ahora ($)</label><input name="pagado" type="number" step="0.01" required value="${data?.pagado||'0'}"></div></div><div class="field-row"><div class="field"><label>Fecha Vto.</label><input name="fechaVencimiento" type="date" required value="${data?.fechaVencimiento||''}"></div><div class="field"><label>Cant. Cuotas</label><input name="cuotas" type="number" value="${data?.cuotas||'1'}"></div></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button type="submit" class="btn">Guardar</button></div></form>`,
    'gasto': `<form id="mform_gasto"><input type="hidden" name="expedienteId" value="${data?.expedienteId||''}"><div class="field-row"><div class="field"><label>Fecha</label><input name="fecha" type="date" required value="${data?.fecha||todayStr()}"></div><div class="field"><label>Importe ($)</label><input name="importe" type="number" step="0.01" required value="${data?.importe||''}"></div></div><div class="field"><label>Concepto (Bono, Tasa...)</label><input name="concepto" required value="${data?.concepto||''}"></div><div class="field-row"><div class="field"><label>Pagado por</label><select name="pagadoPor"><option value="estudio" ${data?.pagadoPor==='estudio'?'selected':''}>El Estudio</option><option value="cliente" ${data?.pagadoPor==='cliente'?'selected':''}>El Cliente</option></select></div><div class="field"><label style="margin-top:20px;"><input type="checkbox" name="reintegrado" ${data?.reintegrado?'checked':''}> Ya reintegrado al estudio</label></div></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button type="submit" class="btn">Guardar</button></div></form>`,
    'evento': `<form id="mform_evento"><input type="hidden" name="expedienteId" value="${data?.expedienteId||''}"><div class="field"><label>Fecha</label><input name="fecha" type="date" required value="${data?.fecha||todayStr()}"></div><div class="field"><label>Descripción del Movimiento</label><textarea name="descripcion" required>${data?.descripcion||''}</textarea></div><div class="field"><label>Vincular Documento (Opcional)</label><select name="documentoId"><option value="">— Ninguno —</option>${state.documentos.filter(d=>d.expedienteId===data?.expedienteId).map(d=>`<option value="${d.id}" ${data?.documentoId===d.id?'selected':''}>${d.nombre}</option>`).join('')}</select></div><div class="field"><label>Generar Vencimiento por Trámite (Opcional)</label><select name="tipoTramiteId"><option value="">— Ninguno —</option>${state.tiposTramite.map(t=>`<option value="${t.id}" ${data?.tipoTramiteId===t.id?'selected':''}>${t.nombre} (${t.dias} días ${t.modo})</option>`).join('')}</select></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button type="submit" class="btn">Guardar Evento</button></div></form>`,
    'vencimiento': `<form id="mform_vencimiento"><div class="field"><label>Expediente</label><select name="expedienteId" required>${state.expedientes.map(e=>`<option value="${e.id}" ${data?.expedienteId===e.id?'selected':''}>${e.caratula}</option>`).join('')}</select></div><div class="field-row"><div class="field"><label>Trámite / tipo</label><input name="tipo" required value="${data?.tipo||''}"></div><div class="field"><label>Fecha Vto</label><input name="fecha" type="date" required value="${data?.fecha||todayStr()}"></div></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button type="submit" class="btn">Guardar</button></div></form>`,
    'documento': `<form id="mform_documento"><input type="hidden" name="expedienteId" value="${data?.expedienteId||''}"><div class="field-row"><div class="field"><label>Nombre del documento</label><input name="nombre" required value="${data?.nombre||''}"></div><div class="field"><label>Tipo</label><select name="tipo">${['Escrito','Cédula','Oficio','Prueba','Otro'].map(t=>`<option value="${t}" ${data?.tipo===t?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="field"><label>Fecha</label><input name="fecha" type="date" required value="${data?.fecha||todayStr()}"></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button type="submit" class="btn">Guardar</button></div></form>`,
    'tramite': `<form id="mform_tramite"><div class="field"><label>Nombre del Trámite</label><input name="nombre" required value="${data?.nombre||''}"></div><div class="field-row"><div class="field"><label>Días de plazo</label><input name="dias" type="number" min="1" required value="${data?.dias||''}"></div><div class="field"><label>Cómo se cuentan</label><select name="modo"><option value="corridos" ${data?.modo==='corridos'?'selected':''}>Corridos</option><option value="habiles" ${data?.modo==='habiles'?'selected':''}>Hábiles</option></select></div></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button type="submit" class="btn">Guardar</button></div></form>`,
    'formato': `<form id="mform_formato"><div class="field"><label>Nombre de Plantilla</label><input name="nombre" required value="${data?.nombre||''}"></div><div class="field"><label>Categoría</label><select name="categoria">${['Escrito','Cédula','Oficio','Otro'].map(c=>`<option value="${c}" ${data?.categoria===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Contenido</label><textarea name="contenido" required>${data?.contenido||''}</textarea></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button type="submit" class="btn">Guardar</button></div></form>`
  };

  const titleMap = { 'cliente': 'Cliente', 'expediente': 'Expediente', 'honorario': 'Honorario', 'gasto': 'Gasto', 'evento': 'Evento', 'vencimiento': 'Vencimiento', 'documento': 'Documento', 'tramite': 'Plazo Configurado', 'formato': 'Formato Base' };
  
  if(!modales[type]) return '';
  return `<div class="overlay" onclick="if(event.target===this) closeModal()"><div class="modal"><h3>${data?.id?'Editar':'Nuevo'} ${titleMap[type]}</h3>${modales[type]}</div></div>`;
}

function attachModalEvents(){
  const actions = {
    'mform_cliente': saveCliente, 'mform_expediente': saveExpediente, 'mform_honorario': saveHonorario,
    'mform_gasto': saveGasto, 'mform_evento': saveEvento, 'mform_vencimiento': saveVencimiento,
    'mform_documento': saveDocumento, 'mform_tramite': saveTramite, 'mform_formato': saveFormato
  };
  
  Object.keys(actions).forEach(id => {
    const form = document.getElementById(id);
    if(form) {
      form.addEventListener('submit', async (ev)=>{
        ev.preventDefault();
        const obj = Object.fromEntries(new FormData(form).entries());
        if(state.modal.data && state.modal.data.id) obj.id = state.modal.data.id;
        await actions[id](obj);
      });
    }
  });

  const formConfig = document.getElementById('mform_config');
  if(formConfig) {
    formConfig.addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      state.config.usuarioActual = new FormData(formConfig).get('usuarioActual');
      state.config.rutaRaiz = new FormData(formConfig).get('rutaRaiz');
      await saveState(); showToast('Configuración guardada'); render();
    });
  }
}

// --- Inicio ---
loadState();
</script>
</body>
</html>
