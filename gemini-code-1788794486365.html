async function loadState(){
  try{
    let res = window.storage ? await window.storage.get('estudio-data') : { value: localStorage.getItem('estudio-data') };

      const parsed = JSON.parse(res.value);
      state.config = { ...seed.config, ...(parsed.config || {}) };
      state.clientes = parsed.clientes || [];
      state.expedientes = parsed.expedientes || [];
      state.vencimientos = parsed.vencimientos || [];
      state.eventos = parsed.eventos || [];
      state.documentos = (parsed.documentos && parsed.documentos.length) ? parsed.documentos : seed.documentos;
      state.formatos = (parsed.formatos && parsed.formatos.length) ? parsed.formatos : seed.formatos;
      state.tiposTramite = (parsed.tiposTramite && parsed.tiposTramite.length) ? parsed.tiposTramite : seed.tiposTramite;
      state.gastos = parsed.gastos || [];
      state.honorarios = parsed.honorarios || [];
      state.ferias = (parsed.ferias && parsed.ferias.length) ? parsed.ferias : seed.ferias;
    } else {
      state = {...state, ...seed};
      await saveState();
    }
  }catch(e){ state = {...state, ...seed}; }
  render();
}

async function saveState(){

function fmtFecha(f){ if(!f) return ''; const [y,m,d]=f.split('-'); return `${d}/${m}/${y}`; }
function formatDinero(num){ return new Intl.NumberFormat('es-AR', {style:'currency', currency:'ARS'}).format(num || 0); }
function escAttr(obj){ return `JSON.parse(decodeURIComponent('${encodeURIComponent(JSON.stringify(obj))}'))`; }

function sanitizePathName(str) {
  if(!str) return 'sin_nombre';
  return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]/g, "_").toLowerCase().replace(/_+/g, '_');
}

function normStr(str) {
  if (!str) return '';
  return str.toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function highlightMatch(text, query) {
  if (!text) return '';
  const textStr = String(text);
  const qNorm = normStr(query);
  if (!qNorm) return escapeHtml(textStr);
  const tNorm = normStr(textStr);
  const idx = tNorm.indexOf(qNorm);
  if (idx === -1) return escapeHtml(textStr);
  
  const before = escapeHtml(textStr.slice(0, idx));
  const match = escapeHtml(textStr.slice(idx, idx + qNorm.length));
  const after = escapeHtml(textStr.slice(idx + qNorm.length));
  return `${before}<mark class="hl">${match}</mark>${after}`;
}

// Cómputo de plazos procesales judiciales: días corridos o hábiles (excluye fines de semana y ferias)
function addBusinessDays(startDateStr, days, modo) {
  let d = new Date(startDateStr + 'T00:00:00');
  const numDays = Math.max(1, Number(days) || 1);
  if (modo === 'corridos') {
    d.setDate(d.getDate() + numDays);
    return d.toISOString().slice(0, 10);
  }
  let added = 0;
  while (added < numDays) {
    d.setDate(d.getDate() + 1);
    const dayOfWeek = d.getDay();
    if (dayOfWeek === 0 || dayOfWeek === 6) continue;
    const dateStr = d.toISOString().slice(0, 10);
    const enFeria = (state.ferias || []).some(f => dateStr >= f.desde && dateStr <= f.hasta);
    if (enFeria) continue;
    added++;
  }
  return d.toISOString().slice(0, 10);
}

// --- Generador de Escritos Dinámicos ---
function generarEscritoDesdePlantilla(plantillaId, expedienteId) {
  const plantilla = state.formatos.find(f => f.id === plantillaId);
  const exp = state.expedientes.find(e => e.id === expedienteId);
  if (!plantilla || !exp) return '';

  const cli = state.clientes.find(c => c.id === exp.clienteId) || {};
  const hoy = new Date();
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const fechaLarga = `${hoy.getDate()} de ${meses[hoy.getMonth()]} de ${hoy.getFullYear()}`;

  const vars = {
    '{{caratula}}': exp.caratula || '',
    '{{numero}}': exp.numero || '',
    '{{fuero}}': exp.fuero || '',
    '{{juzgado}}': exp.juzgado || '',
    '{{cliente}}': cli.nombre || '',
    '{{cliente_doc}}': cli.doc || '',
    '{{cliente_telefono}}': cli.telefono || '',
    '{{cliente_email}}': cli.email || '',
    '{{contraparte}}': exp.contraparteNombre || '',
    '{{contraparte_abogado}}': exp.contraparteAbogado || '',
    '{{abogado}}': state.config.abogadoNombre || state.config.usuarioActual || 'Dr/a. Abogado/a',
    '{{tomo_folio}}': state.config.abogadoMatricula || 'T° ... F° ...',
    '{{abogado_cuit}}': state.config.abogadoCuit || '',
    '{{domicilio_constituido}}': state.config.domicilioConstituido || '',
    '{{domicilio_electronico}}': state.config.domicilioElectronico || '',
    '{{fecha}}': fechaLarga,
    '{{fecha_corta}}': fmtFecha(todayStr())
  };

  let texto = plantilla.contenido || '';
  Object.keys(vars).forEach(key => {
    texto = texto.split(key).join(vars[key]);
  });
  return texto;
}

// --- Generador de Resumen de Cobranza ---
function generarTextoResumenCobranza(expId) {
  const exp = state.expedientes.find(e => e.id === expId);
  if(!exp) return '';
  const cli = state.clientes.find(c => c.id === exp.clienteId) || {};
  const hons = state.honorarios.filter(h => h.expedienteId === expId);
  const gastos = state.gastos.filter(g => g.expedienteId === expId && g.pagadoPor === 'estudio' && !g.reintegrado);

  const saldoHonorarios = hons.reduce((acc, h) => acc + (Number(h.monto || 0) - Number(h.pagado || 0)), 0);
  const totalGastosPendientes = gastos.reduce((acc, g) => acc + Number(g.importe || 0), 0);
  const totalGeneralAPagar = saldoHonorarios + totalGastosPendientes;

  let txt = `*ESTADO DE CUENTA - ESTUDIO JURÍDICO*\n`;
  txt += `Estimado/a *${cli.nombre || 'Cliente'}*:\nLe enviamos el resumen de saldos de su causa:\n_${exp.caratula}_\n\n`;
  
  if (saldoHonorarios > 0) {
    txt += `*1. Honorarios profesionales pendientes:* ${formatDinero(saldoHonorarios)}\n`;
  }
  if (totalGastosPendientes > 0) {
    txt += `*2. Gastos judiciales adelantados por el estudio a reintegrar:* ${formatDinero(totalGastosPendientes)}\n`;
    gastos.forEach(g => {
      txt += `   - ${fmtFecha(g.fecha)}: ${g.concepto} (${formatDinero(g.importe)})\n`;
    });
  }
  txt += `\n*TOTAL A ABONAR:* ${formatDinero(totalGeneralAPagar)}\n\n`;
  txt += `🏦 *Datos bancarios para transferencia:*\n`;
  txt += `- Banco: ${state.config.banco || 'Banco Galicia'}\n`;
  txt += `- Titular: ${state.config.titularCuenta || 'Ignacio Toto'}\n`;
  txt += `- Alias: *${state.config.alias || 'ESTUDIO.TOTO.LEGAL'}*\n`;
  txt += `- CBU: ${state.config.cbu || '0170099320000012345678'}\n\n`;
  txt += `Una vez realizada la transferencia, le solicitamos nos envíe el comprobante por este medio. ¡Muchas gracias!`;
  return txt;
}

// --- CRUD con Trazabilidad ---
async function saveGeneric(col, form){
  const now = todayStr();
  const isNew = !form.id;
  const data = { 
    id: form.id || uid(), 
    ...form,
    actualizadoPor: state.config.usuarioActual,
    actualizadoEn: now
  };
  if(isNew) {
    data.creadoPor = state.config.usuarioActual;
    data.creadoEn = now;
  } else {
    const existing = state[col].find(x=>x.id===data.id);
    if(existing) { data.creadoPor = existing.creadoPor; data.creadoEn = existing.creadoEn; }
  }
  
  const idx = state[col].findIndex(x=>x.id===data.id);
  if(idx>=0) state[col][idx]=data; else state[col].push(data);
  await saveState(); closeModal(); render();
}
async function deleteGeneric(col, id){ 
  state[col] = state[col].filter(x=>x.id!==id); 
  await saveState(); render(); 
}

function estadoVencimiento(v){
  if(v.cumplido) return 'cumplido';
  const hoy = todayStr();
  if(v.fecha < hoy) return 'vencido';
  if(v.fecha === hoy) return 'hoy'; 
  const diff = Math.round((new Date(v.fecha) - new Date(hoy))/(1000*60*60*24));
  if(diff <= 5) return 'proximo';
  return 'programado';
}
const estadoLabel = {vencido:'Vencido', hoy:'Vence HOY', proximo:'Próximo', programado:'Programado', cumplido:'Cumplido'};

function getSemaforoInactividad(expedienteId) {
  const e = state.expedientes.find(x=>x.id===expedienteId);
  if(!e) return '';
  if(e.estado === 'archivado') return `<span class="tag archivado">Archivado</span>`;
  const evs = state.eventos.filter(ev => ev.expedienteId === expedienteId).sort((a,b) => b.fecha.localeCompare(a.fecha));
  if (evs.length === 0) return `<span class="tag archivado">Sin mov.</span>`;
  const diff = Math.round((new Date(todayStr()) - new Date(evs[0].fecha)) / (1000*60*60*24));
  if (diff <= 15) return `<span class="tag cumplido">${diff}d (Al día)</span>`;
  if (diff <= 30) return `<span class="tag proximo">${diff}d (Revisar)</span>`;
  return `<span class="tag vencido" style="font-weight:700;">${diff}d (Paralizado)</span>`;
}

      <li><button class="${state.view==='expedientes'||state.view==='expediente-detail'?'active':''}" onclick="setView('expedientes')">Expedientes <span class="count">${state.expedientes.filter(e=>e.estado==='activo').length}</span></button></li>
      <li><button class="${state.view==='agenda'?'active':''}" onclick="setView('agenda')">Agenda ${pend.length?`<span class="count">${pend.length}</span>`:''}</button></li>
      <li><button class="${state.view==='clientes'?'active':''}" onclick="setView('clientes')">Clientes <span class="count">${state.clientes.length}</span></button></li>
      <li><button class="${state.view==='formatos'?'active':''}" onclick="setView('formatos')">Modelos / Escritos <span class="count">${state.formatos.length}</span></button></li>
      <li><button class="${state.view==='tramites'?'active':''}" onclick="setView('tramites')">Plazos</button></li>
    `;
  }

  // Actualizar Main Content
  const mainEl = document.getElementById('main-content');
  if (mainEl) {
    mainEl.innerHTML = 
      state.view==='search' ? renderSearch() :
      state.view==='panel' ? renderPanel(pend) :
      state.view==='expedientes' ? renderExpedientes() :
      state.view==='expediente-detail' ? renderExpedienteDetail() :
      state.view==='agenda' ? renderAgenda(pend) :
      state.view==='clientes' ? renderClientes() :
      state.view==='formatos' ? renderFormatos() :
      state.view==='tramites' ? renderTramites() :
      renderConfig();
  }

  // Actualizar Modales
  const modalContainer = document.getElementById('modal-container');
  if (modalContainer) {
    modalContainer.innerHTML = state.modal ? renderModal() : '';
    if (state.modal) attachModalEvents();
  }
}

// --- Vista de Búsqueda Global ("Lex Doctor style") ---
function renderSearch() {
  const rawQ = (state.searchQuery || '').trim();
  const qNorm = normStr(rawQ);

  if (!qNorm) {
    return `
      <div class="page-head">
        <div><h2>Búsqueda General</h2><p>Escribí cualquier término para buscar en toda la base del estudio.</p></div>
      </div>
      <div class="empty">Comenzá a escribir en el cuadro de búsqueda para buscar carátulas, clientes, números, documentos o providencias.</div>
    `;
  }

  // Búsqueda en Clientes
  const resCli = state.clientes.filter(c => {
    return normStr(c.nombre).includes(qNorm) ||
           normStr(c.doc).includes(qNorm) ||
           normStr(c.telefono).includes(qNorm) ||
           normStr(c.email).includes(qNorm) ||
           normStr(c.notas).includes(qNorm);
  });

  // Búsqueda en Expedientes
  const resExp = state.expedientes.filter(e => {
    const cliNom = clienteNombre(e.clienteId);
    return normStr(e.caratula).includes(qNorm) ||
           normStr(e.numero).includes(qNorm) ||
           normStr(e.fuero).includes(qNorm) ||
           normStr(e.juzgado).includes(qNorm) ||
           normStr(e.contraparteNombre).includes(qNorm) ||
           normStr(e.contraparteAbogado).includes(qNorm) ||
           normStr(e.notas).includes(qNorm) ||
           normStr(cliNom).includes(qNorm);
  });

  // Búsqueda en Movimientos y Actuaciones
  const resMov = state.eventos.filter(ev => {
    const car = expedienteCaratula(ev.expedienteId);
    return normStr(ev.descripcion).includes(qNorm) || normStr(car).includes(qNorm);
  });

  // Búsqueda en Vencimientos
  const resVenc = state.vencimientos.filter(v => {
    const car = expedienteCaratula(v.expedienteId);
    return normStr(v.tipo).includes(qNorm) || normStr(v.notas).includes(qNorm) || normStr(car).includes(qNorm);
  });

  const total = resExp.length + resCli.length + resMov.length + resVenc.length;

  return `
    <div class="page-head">
      <div>
        <h2>Resultados para "${escapeHtml(rawQ)}"</h2>
        <p>Se encontraron ${total} coincidencia(s) en causas, clientes y actuaciones.</p>
      </div>
      <button class="btn secondary" onclick="clearSearch()">Cerrar búsqueda (Esc)</button>
    </div>
    
    <!-- Expedientes -->
    <div class="block">
      <div class="block-head">Expedientes y Causas (${resExp.length})</div>
      ${resExp.length===0 ? '<div class="empty">No hay expedientes con ese criterio.</div>' : `
      <table>
        <thead><tr><th>Carátula y N°</th><th>Fuero / Juzgado</th><th>Cliente</th><th>Estado</th></tr></thead>
        <tbody>
        ${resExp.map(e=>`
          <tr class="row-click" onclick="viewExpediente('${e.id}')">
            <td>
              <strong>${highlightMatch(e.caratula, rawQ)}</strong><br>
              <span class="muted">${highlightMatch(e.numero||'S/N', rawQ)} ${e.contraparteNombre ? '· Contraparte: ' + highlightMatch(e.contraparteNombre, rawQ) : ''}</span>
            </td>
            <td>${highlightMatch(e.fuero, rawQ)}<br><span class="muted">${highlightMatch(e.juzgado||'—', rawQ)}</span></td>
            <td>${highlightMatch(clienteNombre(e.clienteId), rawQ)}</td>
            <td><span class="tag ${e.estado}">${e.estado==='activo'?'Activo':'Archivado'}</span></td>
          </tr>
        `).join('')}
        </tbody>
      </table>`}
    </div>

    <!-- Clientes -->
    <div class="block">
      <div class="block-head">Clientes (${resCli.length})</div>
      ${resCli.length===0 ? '<div class="empty">No hay clientes con ese criterio.</div>' : `
      <table>
        <thead><tr><th>Nombre</th><th>DNI / CUIT</th><th>Contacto</th><th>Notas</th></tr></thead>
        <tbody>
        ${resCli.map(c=>`
          <tr class="row-click" onclick="openModal('cliente', ${escAttr(c)})">
            <td><strong>${highlightMatch(c.nombre, rawQ)}</strong></td>
            <td>${highlightMatch(c.doc||'—', rawQ)}</td>
            <td>${highlightMatch(c.telefono||'', rawQ)} ${c.email ? '<br><span class="muted">' + highlightMatch(c.email, rawQ) + '</span>' : ''}</td>
            <td class="muted">${highlightMatch(c.notas||'—', rawQ)}</td>
          </tr>
        `).join('')}
        </tbody>
      </table>`}
    </div>

    <!-- Movimientos / Actuaciones -->
    <div class="block">
      <div class="block-head">Actuaciones y Movimientos (${resMov.length})</div>
      ${resMov.length===0 ? '<div class="empty">No hay movimientos que coincidan.</div>' : `
      <table>
        <thead><tr><th style="width:100px">Fecha</th><th>Expediente</th><th>Descripción</th></tr></thead>
        <tbody>
        ${resMov.map(ev=>`
          <tr class="row-click" onclick="viewExpediente('${ev.expedienteId}')">
            <td>${fmtFecha(ev.fecha)}</td>
            <td><strong>${highlightMatch(expedienteCaratula(ev.expedienteId), rawQ)}</strong></td>
            <td>${highlightMatch(ev.descripcion, rawQ)}</td>
          </tr>
        `).join('')}
        </tbody>
      </table>`}
    </div>

    <!-- Vencimientos -->
    ${resVenc.length > 0 ? `
    <div class="block">
      <div class="block-head">Vencimientos Asociados (${resVenc.length})</div>
      <table>
        <thead><tr><th>Estado</th><th>Fecha</th><th>Trámite</th><th>Expediente</th></tr></thead>
        <tbody>
        ${resVenc.map(v=>{
          const est = estadoVencimiento(v);
          return `
          <tr class="row-click" onclick="viewExpediente('${v.expedienteId}')">
            <td><span class="tag ${est}">${estadoLabel[est]}</span></td>
            <td>${fmtFecha(v.fecha)}</td>
            <td><strong>${highlightMatch(v.tipo, rawQ)}</strong> ${v.notas ? `<br><span class="muted">${highlightMatch(v.notas, rawQ)}</span>` : ''}</td>
            <td>${highlightMatch(expedienteCaratula(v.expedienteId), rawQ)}</td>
          </tr>
          `;
        }).join('')}
        </tbody>
      </table>
    </div>` : ''}
  `;
}

// --- Vista Panel ---
function renderPanel(pend){
  const vencidos = pend.filter(v=>estadoVencimiento(v)==='vencido').length;
  const hoy = pend.filter(v=>estadoVencimiento(v)==='hoy').length;
  const proximos = pend.filter(v=>estadoVencimiento(v)==='proximo').length;
  const proximaLista = pend.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(0,6);

  const totalGastosEstudioGlobal = state.gastos.filter(g => g.pagadoPor === 'estudio' && !g.reintegrado).reduce((acc, g) => acc + Number(g.importe || 0), 0);
  const totalHonorariosPendientesGlobal = state.honorarios.reduce((acc, h) => acc + (Number(h.monto || 0) - Number(h.pagado || 0)), 0);
  
  return `
    <div class="page-head">
      <div><h2>Panel de Control</h2><p>Estado general del estudio hoy ${fmtFecha(todayStr())}.</p></div>
      <button class="btn wa" onclick="enviarWhatsAppResumenDiario()">📱 Compartir Resumen Diario</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="n">${state.expedientes.filter(e=>e.estado==='activo').length}</div><div class="l">Expedientes activos</div></div>
      <div class="stat alert"><div class="n">${vencidos}</div><div class="l">Vencidos</div></div>
      <div class="stat warn" style="background:#fdfcf9; border-color:#d4a953;"><div class="n" style="color:#805a13">${hoy}</div><div class="l">Vencen HOY (Gracia)</div></div>
      <div class="stat warn"><div class="n">${proximos}</div><div class="l">Próximos (5 días)</div></div>
      <div class="stat" style="background:#FAF8F3;"><div class="n" style="font-size:22px; color:var(--burgundy);">${formatDinero(totalGastosEstudioGlobal)}</div><div class="l">Gastos a reintegrar</div></div>
      <div class="stat" style="background:#FAF8F3;"><div class="n" style="font-size:22px; color:var(--green);">${formatDinero(totalHonorariosPendientesGlobal)}</div><div class="l">Honorarios por cobrar</div></div>
    </div>
    <div class="block">
      <div class="block-head">Próximos vencimientos <button class="link-btn" onclick="setView('agenda')">Ver agenda completa</button></div>
      ${proximaLista.length===0 ? `<div class="empty">No hay vencimientos pendientes.</div>` : `
      <table><tbody>
        ${proximaLista.map(v=>{
          const est = estadoVencimiento(v);
          return `<tr class="row-click" onclick="viewExpediente('${v.expedienteId}')">
            <td style="width:140px"><span class="tag ${est}">${estadoLabel[est]}</span></td>
            <td style="width:100px">${fmtFecha(v.fecha)}</td>
            <td><strong>${v.tipo}</strong></td>
            <td class="muted">${expedienteCaratula(v.expedienteId)}</td>
          </tr>`;
        }).join('')}
      </tbody></table>`}
    </div>
  `;
}

// --- Vista Expedientes ---
function setExpFiltroEstado(estado) {
  state.expedientesFiltroEstado = estado;
  render();
}

function setExpFiltroTexto(txt) {
  state.expedientesFiltroTexto = txt;
  render();
}

function renderExpedientes(){
  const fEstado = state.expedientesFiltroEstado || 'activos';
  const fTexto = normStr(state.expedientesFiltroTexto || '');

  const totalActivos = state.expedientes.filter(e => e.estado === 'activo').length;
  const totalArchivados = state.expedientes.filter(e => e.estado === 'archivado').length;

  let filtrados = state.expedientes.slice();
  if (fEstado === 'activos') {
    filtrados = filtrados.filter(e => e.estado === 'activo');
  } else if (fEstado === 'archivados') {
    filtrados = filtrados.filter(e => e.estado === 'archivado');
  }

  if (fTexto) {
    filtrados = filtrados.filter(e => {
      const cliNom = clienteNombre(e.clienteId);
      return normStr(e.caratula).includes(fTexto) ||
             normStr(e.numero).includes(fTexto) ||
             normStr(e.fuero).includes(fTexto) ||
             normStr(e.juzgado).includes(fTexto) ||
             normStr(cliNom).includes(fTexto);
    });
  }

  return `
    <div class="page-head">
      <div><h2>Expedientes</h2><p>Causas judiciales y extrajudiciales del estudio.</p></div>
      <button class="btn" onclick="openModal('expediente', null)">+ Nuevo expediente</button>
    </div>

    <div class="filter-tabs">
      <button class="filter-tab ${fEstado==='activos'?'active':''}" onclick="setExpFiltroEstado('activos')">Activos (${totalActivos})</button>
      <button class="filter-tab ${fEstado==='todos'?'active':''}" onclick="setExpFiltroEstado('todos')">Todos (${state.expedientes.length})</button>
      <button class="filter-tab ${fEstado==='archivados'?'active':''}" onclick="setExpFiltroEstado('archivados')">Archivados (${totalArchivados})</button>
      <div style="margin-left:auto; display:flex; align-items:center; gap:6px;">
        <input type="text" placeholder="Filtrar por nombre, juzgado..." value="${escapeHtml(state.expedientesFiltroTexto||'')}" oninput="setExpFiltroTexto(this.value)" style="padding:6px 10px; border:1px solid var(--line); border-radius:3px; font-size:12.5px;">
        ${state.expedientesFiltroTexto ? `<button class="btn secondary small" onclick="setExpFiltroTexto('')">Limpiar</button>` : ''}
      </div>
    </div>

    <div class="block">
      ${filtrados.length===0 ? `<div class="empty">No se encontraron expedientes con los filtros aplicados.</div>` : `
      <table>
        <thead><tr><th>Carátula</th><th>Fuero / Juzgado</th><th>Cliente</th><th>Último Movimiento</th><th>Estado</th><th style="text-align:right">Acciones</th></tr></thead>
        <tbody>
        ${filtrados.sort((a,b)=>a.caratula.localeCompare(b.caratula)).map(e=>`
          <tr class="row-click" onclick="viewExpediente('${e.id}')">
            <td><strong>${e.caratula}</strong><br><span class="muted">${e.numero||'S/N'}</span></td>
            <td>${e.fuero}<br><span class="muted">${e.juzgado||'—'}</span></td>
            <td>${clienteNombre(e.clienteId)}</td>
            <td>${getSemaforoInactividad(e.id)}</td>
            <td><span class="tag ${e.estado}">${e.estado==='activo'?'Activo':'Archivado'}</span></td>
            <td onclick="event.stopPropagation()" style="text-align:right">
              <button class="icon-btn" onclick="openModal('expediente', ${escAttr(e)})">Editar</button>
            </td>
          </tr>
        `).join('')}
        </tbody>
      </table>`}
    </div>
  `;
}

          <label>Expediente</label>
          <div style="padding: 9px 12px; background: #EFE9DC; border: 1px solid var(--line); border-radius: 2px; font-weight: 500; color: var(--ink);">
            ${escapeHtml(expedienteCaratula(expId))}
          </div>
          <input type="hidden" name="expedienteId" value="${escapeHtml(expId)}">
        </div>
      ` : `
        <div class="field"><label>Expediente</label>
          <select name="expedienteId" required>
            <option value="">— Seleccionar causa —</option>
            ${state.expedientes.filter(e=>e.estado==='activo').map(e=>`<option value="${e.id}" ${data?.expedienteId===e.id?'selected':''}>${escapeHtml(e.caratula)}</option>`).join('')}
          </select>
        </div>
      `;

      return `
      <form id="mform_vencimiento">
        ${expedienteHtml}
        <div class="field-row">
          <div class="field"><label>Trámite / Motivo de Vencimiento</label><input name="tipo" required value="${escapeHtml(data?.tipo||'')}"></div>
          <div class="field"><label>Fecha de Vencimiento</label><input name="fecha" type="date" required value="${data?.fecha||todayStr()}"></div>
        </div>
        <div class="field"><label>Notas / Instrucciones</label><input name="notas" value="${escapeHtml(data?.notas||'')}"></div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn">Guardar Vencimiento</button>
        </div>
      </form>`;
    })(),
    
    'documento': (() => {
      const expId = data?.expedienteId || state.selectedExpedienteId;
      const expDoc = state.expedientes.find(e => e.id === expId);
      const rutaSugeridaDoc = expDoc?.rutaCarpeta ? `${expDoc.rutaCarpeta}\\` : '';

      return `
      <form id="mform_documento">
        <input type="hidden" name="expedienteId" value="${escapeHtml(expId||'')}">
        <div class="field-row">
          <div class="field"><label>Nombre del documento</label><input name="nombre" required placeholder="Ej: Demanda_firmada.pdf" value="${escapeHtml(data?.nombre||'')}"></div>
          <div class="field"><label>Tipo</label>
            <select name="tipo">
              ${['Escrito','Cédula','Oficio','Prueba','Demanda','Contestación','Acuerdo','Poder','Otro'].map(t=>`<option value="${t}" ${data?.tipo===t?'selected':''}>${t}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Fecha</label><input name="fecha" type="date" required value="${data?.fecha||todayStr()}"></div>
          <div class="field"><label>Causa</label>
            <div style="padding: 8px 10px; background: #EFE9DC; border: 1px solid var(--line); border-radius: 2px; font-weight: 500; color: var(--ink); font-size:12.5px;">
              ${escapeHtml(expedienteCaratula(expId))}
            </div>
          </div>
        </div>
        <div class="field">
          <label>Ruta o Ubicación donde se guardó el archivo (PC o Servidor)</label>
          <div style="display:flex; gap:6px;">
            <input name="rutaArchivo" id="input_doc_rutaArchivo" placeholder="Ej: \\\\SERVIDOR\\Estudio\\rios\\daños\\demanda.pdf o C:\\Users\\..." value="${escapeHtml(data?.rutaArchivo || rutaSugeridaDoc)}">
            <button type="button" class="btn secondary small" onclick="copiarAlPortapapeles(document.getElementById('input_doc_rutaArchivo').value, 'Ruta copiada')" title="Copiar ruta al portapapeles">📋 Copiar</button>
          </div>
          <span class="meta-text">💡 Guardá la ruta donde está archivado el archivo para copiarla rápidamente cuando lo necesites abrir o buscar en el Explorador de Windows.</span>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn">Guardar Documento</button>
        </div>
      </form>`;
    })(),
    
    'tramite': `
      <form id="mform_tramite">
        <div class="field"><label>Nombre del Trámite</label><input name="nombre" required value="${escapeHtml(data?.nombre||'')}"></div>
        <div class="field-row">
          <div class="field"><label>Días de plazo</label><input name="dias" type="number" min="1" required value="${data?.dias||''}"></div>
          <div class="field"><label>Cómputo</label>
            <select name="modo">
              <option value="habiles" ${data?.modo==='habiles'?'selected':''}>Hábiles Judiciales</option>
              <option value="corridos" ${data?.modo==='corridos'?'selected':''}>Corridos</option>
            </select>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn">Guardar Trámite</button>
        </div>
      </form>`,
    
    'formato': `
      <form id="mform_formato">
        <div class="field"><label>Nombre de la Plantilla</label><input name="nombre" required value="${escapeHtml(data?.nombre||'')}"></div>
        <div class="field"><label>Categoría</label>
          <select name="categoria">
            ${['Escrito','Cédula','Oficio','Demanda','Contestación','Otro'].map(c=>`<option value="${c}" ${data?.categoria===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Contenido Base (con variables {{caratula}}, {{juzgado}}, etc.)</label><textarea name="contenido" rows="8" required style="font-family:monospace; font-size:12.5px;">${escapeHtml(data?.contenido||'')}</textarea></div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn">Guardar Plantilla</button>
        </div>
      </form>`,

    'seleccionar_causa_para_plantilla': (() => {
      const f = state.formatos.find(x => x.id === data?.formatoId);
      const activos = state.expedientes.filter(e => e.estado === 'activo');
      return `
        <div style="margin-bottom:16px;">
          <p style="color:var(--ink-soft); margin-top:0;">Plantilla seleccionada: <strong>${escapeHtml(f ? f.nombre : '')}</strong></p>
          <div class="field">
            <label>Elegí la causa judicial donde querés redactar este escrito:</label>
            <select id="select_causa_destino">
              ${activos.map(e => `<option value="${e.id}">${escapeHtml(e.caratula)} (${escapeHtml(e.numero||'S/N')})</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button>
          <button type="button" class="btn" onclick="const eid=document.getElementById('select_causa_destino').value; openModal('redactar_escrito', {expedienteId: eid, formatoId: '${data?.formatoId}'});">Abrir Redactor de Escrito →</button>
        </div>
      `;
    })(),

    'redactar_escrito': (() => {
      const exp = state.expedientes.find(e => e.id === data?.expedienteId);
      if (!exp) return '<div class="empty">No se encontró el expediente.</div>';
      const formatosDisponibles = state.formatos || [];
      const formatoSeleccionadoId = data?.formatoId || formatosDisponibles[0]?.id || '';
      const textoGenerado = generarEscritoDesdePlantilla(formatoSeleccionadoId, exp.id);

      return `
        <div style="margin-bottom:14px;">
          <p style="color:var(--ink-soft); margin:0 0 10px 0; font-size:13px;">
            Causa: <strong>${escapeHtml(exp.caratula)}</strong> (${escapeHtml(exp.numero||'S/N')})
          </p>
          <div class="field">
            <label>Elegir Plantilla de Escrito</label>
            <select onchange="cambiarPlantillaEscrito('${exp.id}', this.value)">
              ${formatosDisponibles.map(f => `<option value="${f.id}" ${f.id===formatoSeleccionadoId?'selected':''}>${escapeHtml(f.nombre)} (${f.categoria})</option>`).join('')}
            </select>
          </div>
        </div>

        <div class="field">
          <label>Texto del Escrito (Completado y Editable)</label>
          <textarea id="texto-escrito-generado" style="font-family:'Courier New', monospace; font-size:13px; line-height:1.45; min-height:260px; width:100%; border:1px solid var(--line); padding:10px; border-radius:3px;">${escapeHtml(textoGenerado)}</textarea>
        </div>

        <div style="font-size:11.5px; color:var(--ink-soft); background:#F1EDE1; padding:8px 12px; border-radius:3px; margin-bottom:16px;">
          💡 <em>Podés retocar o escribir texto adicional directamente en el cuadro de arriba antes de copiarlo.</em>
        </div>

        <div class="modal-actions" style="justify-content:space-between; flex-wrap:wrap; gap:8px;">
          <button type="button" class="btn secondary" onclick="closeModal()">Cerrar</button>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button type="button" class="btn secondary" onclick="descargarEscrito('${escapeHtml(exp.caratula)}')">⬇ Descargar (.txt)</button>
            <button type="button" class="btn secondary" onclick="guardarEscritoComoDocumento('${exp.id}', '${escapeHtml(exp.caratula)}')">📎 Guardar en Causa</button>
            <button type="button" class="btn" onclick="copiarEscritoAlPortapapeles()">📋 Copiar Escrito</button>
          </div>
        </div>
      `;
    })(),

    'estado_cuenta': (() => {
      const exp = state.expedientes.find(e => e.id === data?.expedienteId);
      if (!exp) return '<div class="empty">No se encontró el expediente.</div>';
      const cli = state.clientes.find(c => c.id === exp.clienteId) || {};
      const hons = state.honorarios.filter(h => h.expedienteId === exp.id);
      const gastos = state.gastos.filter(g => g.expedienteId === exp.id && g.pagadoPor === 'estudio' && !g.reintegrado);

      const saldoHonorarios = hons.reduce((acc, h) => acc + (Number(h.monto||0) - Number(h.pagado||0)), 0);
      const totalGastosPendientes = gastos.reduce((acc, g) => acc + Number(g.importe||0), 0);
      const totalGeneralAPagar = saldoHonorarios + totalGastosPendientes;

      return `
        <div style="margin-bottom:14px;">
          <p style="color:var(--ink-soft); margin:0 0 6px 0; font-size:13px;">
            Cliente: <strong>${escapeHtml(cli.nombre||'—')}</strong> ${cli.telefono ? '· Tel: ' + escapeHtml(cli.telefono) : ''}
          </p>
          <p style="color:var(--ink-soft); margin:0; font-size:12.5px;">
            Causa: <em>${escapeHtml(exp.caratula)}</em>
          </p>
        </div>

        <!-- Desglose Honorarios -->
        <div style="background:#fff; border:1px solid var(--line); padding:12px; border-radius:3px; margin-bottom:12px;">
          <h4 style="margin:0 0 8px 0; font-size:12px; text-transform:uppercase; color:var(--ink-soft);">1. Honorarios Profesionales</h4>
          ${hons.length === 0 ? '<div style="font-size:12px; color:var(--ink-soft);">Sin honorarios pendientes registrados.</div>' : `
            <table style="font-size:12.5px;">
              <tbody>
                ${hons.map(h => `
                  <tr>
                    <td>${escapeHtml(h.concepto)}</td>
                    <td style="text-align:right;">Saldo: <strong>${formatDinero(Number(h.monto||0) - Number(h.pagado||0))}</strong></td>
                  </tr>
                `).join('')}
                <tr style="font-weight:600; border-top:1px solid var(--line);">
                  <td>Subtotal Honorarios a Cobrar:</td>
                  <td style="text-align:right; color:var(--navy);">${formatDinero(saldoHonorarios)}</td>
                </tr>
              </tbody>
            </table>
          `}
        </div>

        <!-- Desglose Gastos Adelantados -->
        <div style="background:#fff; border:1px solid var(--line); padding:12px; border-radius:3px; margin-bottom:12px;">
          <h4 style="margin:0 0 8px 0; font-size:12px; text-transform:uppercase; color:var(--ink-soft);">2. Gastos Adelantados por el Estudio (A reintegrar)</h4>
          ${gastos.length === 0 ? '<div style="font-size:12px; color:var(--green); font-weight:500;">✓ No hay gastos pendientes de reintegro en esta causa.</div>' : `
            <table style="font-size:12.5px;">
              <tbody>
                ${gastos.map(g => `
                  <tr>
                    <td>${fmtFecha(g.fecha)} - ${escapeHtml(g.concepto)}</td>
                    <td style="text-align:right;">${formatDinero(g.importe)}</td>
                  </tr>
                `).join('')}
                <tr style="font-weight:600; border-top:1px solid var(--line);">
                  <td>Subtotal Gastos a Reintegrar:</td>
                  <td style="text-align:right; color:var(--burgundy);">${formatDinero(totalGastosPendientes)}</td>
                </tr>
              </tbody>
            </table>
          `}
        </div>

        <!-- Total General -->
        <div style="background:var(--panel); border:2px solid var(--navy); padding:14px; border-radius:4px; display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
          <div>
            <div style="font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft); font-weight:700;">TOTAL GENERAL A ABONAR</div>
            <div style="font-size:12px; color:var(--ink-soft);">Saldo de Honorarios + Adelantos del Estudio</div>
          </div>
          <div style="font-family:'Fraunces',serif; font-size:24px; color:var(--burgundy); font-weight:700;">
            ${formatDinero(totalGeneralAPagar)}
          </div>
        </div>

        <!-- Datos Bancarios -->
        <div style="background:#F6F4EE; border:1px solid var(--line); padding:12px; border-radius:3px; font-size:12px; margin-bottom:16px;">
          <strong>Datos bancarios para transferencia:</strong><br>
          Banco: <span>${escapeHtml(state.config.banco || 'Banco Galicia')}</span> | Titular: <span>${escapeHtml(state.config.titularCuenta || 'Ignacio Toto')}</span><br>
          Alias: <strong style="color:var(--navy);">${escapeHtml(state.config.alias || 'ESTUDIO.TOTO.LEGAL')}</strong> | CBU: <code>${escapeHtml(state.config.cbu || '0170099320000012345678')}</code>
        </div>

        <div class="modal-actions" style="justify-content:space-between; flex-wrap:wrap; gap:8px;">
          <button type="button" class="btn secondary" onclick="closeModal()">Cerrar</button>
          <div style="display:flex; gap:8px;">
            <button type="button" class="btn secondary" onclick="copiarResumenCobranza('${exp.id}')">📋 Copiar Resumen</button>
            <button type="button" class="btn wa" onclick="enviarCobranzaWhatsApp('${exp.id}')">📱 Enviar Cobranza por WA</button>
          </div>
        </div>
      `;
    })()
  };

  const titleMap = { 
    'cliente': 'Cliente', 
    'expediente': 'Expediente', 
    'honorario': 'Honorario', 
    'gasto': 'Gasto', 
    'evento': 'Actuación / Evento', 
    'vencimiento': 'Vencimiento', 
    'documento': 'Documento de la Causa', 
    'tramite': 'Plazo de Trámite', 
    'formato': 'Plantilla de Escrito',
    'seleccionar_causa_para_plantilla': 'Seleccionar Causa para el Escrito',
    'redactar_escrito': 'Redacción Automática de Escrito',
    'estado_cuenta': 'Estado de Cuenta y Cobranza al Cliente'
  };
  
  if(!modales[type]) return '';
  const isWide = type === 'redactar_escrito' || type === 'estado_cuenta';
  return `<div class="overlay" onclick="if(event.target===this) closeModal()"><div class="modal ${isWide?'wide':''}"><h3>${data?.id && !isWide ?'Editar':'Nuevo'} ${titleMap[type] || 'Registro'}</h3>${modales[type]}</div></div>`;
}

function attachModalEvents(){
  const actions = {
    'mform_cliente': saveCliente, 
    'mform_expediente': saveExpediente, 
    'mform_honorario': saveHonorario,
    'mform_gasto': saveGasto, 
    'mform_evento': saveEvento, 
    'mform_vencimiento': saveVencimiento,
    'mform_documento': saveDocumento, 
    'mform_tramite': saveTramite, 
    'mform_formato': saveFormato
  };
  
  Object.keys(actions).forEach(id => {
    const form = document.getElementById(id);
    if(form) {
      form.addEventListener('submit', async (ev)=>{
        ev.preventDefault();
        const obj = Object.fromEntries(new FormData(form).entries());
        if(state.modal && state.modal.data && state.modal.data.id) obj.id = state.modal.data.id;
        await actions[id](obj);
      });
    }
  });

  const formConfig = document.getElementById('mform_config');
  if(formConfig) {
    formConfig.addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      const fd = new FormData(formConfig);
      state.config = {
        ...state.config,
        usuarioActual: fd.get('usuarioActual'),
        rutaRaiz: fd.get('rutaRaiz'),
        abogadoNombre: fd.get('abogadoNombre'),
        abogadoMatricula: fd.get('abogadoMatricula'),
        abogadoCuit: fd.get('abogadoCuit'),
        domicilioConstituido: fd.get('domicilioConstituido'),
        domicilioElectronico: fd.get('domicilioElectronico'),
        banco: fd.get('banco'),
        titularCuenta: fd.get('titularCuenta'),
        alias: fd.get('alias'),
        cbu: fd.get('cbu')
      };
      await saveState(); 
      showToast('Configuración profesional y bancaria guardada.'); 
      render();
    });
  }
}

// --- Inicialización ---
loadState();
</script>
</body>
</html>
